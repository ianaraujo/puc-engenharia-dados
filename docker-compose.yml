services:
  metabase:
    image: metabase/metabase
    container_name: metabase
    ports:
      - "3000:3000"
    restart: 'always'
    volumes:
      - ./app/:/home/metabase/:rw

  full_load:
    build:
      context: ./app
      dockerfile: docker/Dockerfile
    container_name: full-load
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./app/:/code/:rw